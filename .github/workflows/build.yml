name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

env:
  SINGBOX_VERSION: "1.14.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Download sing-box (for integration tests)
        run: |
          curl -sSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz
          echo "SINGBOX_BIN=$PWD/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          set +e
          go test -v ./internal/... > test.log 2>&1
          rc=$?
          grep -E "^(--- FAIL|FAIL|panic)|_test.go:[0-9]+|cannot|undefined|error" test.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          exit $rc

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build Windows exe (native Walk window, no cgo)
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o dist/proxycheck.exe .
        env:
          CGO_ENABLED: 0
      - name: Bundle sing-box
        shell: bash
        run: |
          curl -sSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-windows-amd64.zip"
          unzip -q sb.zip -d sb
          cp sb/sing-box-${SINGBOX_VERSION}-windows-amd64/* dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: proxycheck-windows-amd64
          path: dist/

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ arm64, amd64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build (no cgo; web interface by default)
        run: |
          mkdir dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o dist/proxycheck .
      - name: Bundle sing-box
        run: |
          curl -sSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-${{ matrix.arch }}.tar.gz"
          tar xzf sb.tgz
          cp sing-box-${SINGBOX_VERSION}-linux-${{ matrix.arch }}/sing-box dist/
          chmod +x dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: proxycheck-linux-${{ matrix.arch }}
          path: dist/

  release:
    needs: [ test, windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Package
        run: |
          mkdir out
          (cd art/proxycheck-windows-amd64 && zip -qr ../../out/proxycheck-windows-amd64.zip .)
          for a in arm64 amd64; do
            tar czf out/proxycheck-linux-$a.tar.gz -C art/proxycheck-linux-$a .
          done
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" out/* --title "$TAG" --generate-notes
          else
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly out/* --prerelease --target "${GITHUB_SHA}" \
              --title "Nightly (последняя сборка main)" \
              --notes "Автосборка коммита ${GITHUB_SHA::7}. Windows: распаковать zip, запустить proxycheck.exe -web. Linux: распаковать tar.gz, запустить ./proxycheck."
          fi
