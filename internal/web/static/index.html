<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proxycheck</title>
<style>
:root{--bg:#fff;--fg:#1c1c1c;--mut:#6b6b6b;--line:#ddd;--acc:#1a6fd4;--ok:#1a9d4b;--bad:#c93a3a;--warn:#c98a00;--row:#f6f7f8}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--fg:#e6e6e6;--mut:#9a9a9a;--line:#33373b;--acc:#5aa2f0;--ok:#4cc27a;--bad:#e06a6a;--warn:#e0b04a;--row:#1e2124}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
button{font:inherit;padding:5px 12px;border:1px solid var(--line);background:var(--row);color:var(--fg);border-radius:4px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
#status{flex:1 1 260px;min-width:200px}
#bar{height:4px;background:var(--line);margin-top:4px;border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
main{padding:10px 14px}
h2{font-size:14px;margin:14px 0 6px;color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;position:sticky;top:0}
tbody tr:nth-child(even){background:var(--row)}
.st{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mut)}
.alive{background:var(--ok)}.dead{background:var(--bad)}.died{background:var(--warn)}
.num{text-align:right}
#log{font:12px ui-monospace,Consolas,monospace;color:var(--mut);max-height:160px;overflow:auto;white-space:pre-wrap;border:1px solid var(--line);padding:6px;border-radius:4px}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:10}
#login div{display:flex;flex-direction:column;gap:8px;width:260px}
input[type=password],input[type=number]{font:inherit;padding:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px}
.err{color:var(--bad)}
</style>
</head>
<body>
<div id="login"><div>
  <b>proxycheck</b>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <button id="loginBtn">Войти</button>
  <span id="loginErr" class="err"></span>
</div></div>

<header>
  <button id="scan">Загрузить и проверить</button>
  <button id="recheck">Перепроверить</button>
  <button id="speed">Скорость отмеченных</button>
  <button id="cancel" disabled>Отмена</button>
  <div id="status"><span id="stText">…</span><div id="bar"><i></i></div></div>
  <button id="logout" style="display:none">Выйти</button>
</header>

<main>
  <h2>Активные линии</h2>
  <div class="wrap"><table><thead><tr><th>Порт</th><th>Сервер</th><th>Статус</th><th></th></tr></thead><tbody id="lines"></tbody></table></div>
  <h2>Серверы <span id="cnt"></span></h2>
  <div class="wrap"><table><thead><tr>
    <th></th><th>Статус</th><th>Имя</th><th>Протокол</th><th>Адрес</th><th class="num">Задержка</th><th>Выходной IP</th><th class="num">↓ Мбит/с</th><th class="num">↑ Мбит/с</th><th></th>
  </tr></thead><tbody id="rows"></tbody></table></div>
  <h2>Журнал</h2>
  <div id="log"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const H={'Content-Type':'application/json','X-Requested-With':'proxycheck'};
const STR={alive:'жив',dead:'мёртв',died:'умер',unknown:'—'};
const ACT={idle:'Простаивает',loading:'Загрузка источников',starting:'Запуск ядра',checking:'Проверка серверов',exitip:'Определение выходного IP',speed:'Замер скорости'};
let busy=false;

async function api(method,path,body){
  const r=await fetch(path,{method,headers:H,body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  if(r.status===401){showLogin();throw new Error('auth')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function showLogin(){$('login').style.display='flex';$('pw').focus()}
async function checkAuth(){
  const a=await (await fetch('/api/auth')).json();
  $('logout').style.display=a.required?'':'none';
  if(a.required&&!a.authenticated){showLogin();return false}
  $('login').style.display='none';return true;
}
$('loginBtn').onclick=async()=>{
  $('loginErr').textContent='';
  try{await api('POST','/api/login',{password:$('pw').value});$('pw').value='';await checkAuth();poll()}
  catch(e){if(e.message!=='auth')$('loginErr').textContent=e.message}
};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
$('logout').onclick=async()=>{await api('POST','/api/logout');showLogin()};

function act(name,fn){return async()=>{try{await fn()}catch(e){if(e.message!=='auth')alert(e.message)}poll()}}
$('scan').onclick=act('scan',()=>api('POST','/api/scan'));
$('recheck').onclick=act('recheck',()=>api('POST','/api/recheck'));
$('cancel').onclick=act('cancel',()=>api('POST','/api/cancel'));
$('speed').onclick=act('speed',()=>{
  const ids=[...document.querySelectorAll('.sel:checked')].map(c=>c.dataset.id);
  if(!ids.length)throw new Error('Отметьте серверы галочками');
  return api('POST','/api/speed',{ids});
});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(s){
  const a=s.activity;busy=a.state!=='idle';
  let t=ACT[a.state]||a.state;
  if(a.detail&&a.state!=='idle')t+=': '+a.detail;
  if(a.total)t+=' ('+a.done+'/'+a.total+')';
  $('stText').textContent=t;
  $('bar').firstElementChild.style.width=a.total?Math.round(a.done*100/a.total)+'%':(busy?'100%':'0');
  ['scan','recheck','speed'].forEach(i=>$(i).disabled=busy);$('cancel').disabled=!busy;
  if(!s.core_ok)$('stText').textContent+=' — ядро sing-box не найдено: '+s.core;
  $('lines').innerHTML=(s.lines||[]).map(l=>`<tr><td>${l.local_port}</td><td>${esc(l.name)}</td><td><span class="st ${l.alive?'alive':'dead'}"></span>${l.alive?'работает':'не отвечает'}</td><td><button data-stop="${esc(l.id)}">Остановить</button></td></tr>`).join('');
  const rows=s.rows||[];$('cnt').textContent='('+rows.filter(r=>r.status==='alive').length+' живых из '+rows.length+')';
  const keep=new Set([...document.querySelectorAll('.sel:checked')].map(c=>c.dataset.id));
  $('rows').innerHTML=rows.map(r=>`<tr><td><input type="checkbox" class="sel" data-id="${esc(r.id)}" ${(r.selected||keep.has(r.id))?'checked':''}></td>
  <td><span class="st ${r.status}"></span>${STR[r.status]||r.status}</td><td>${esc(r.name)}</td><td>${esc(r.proto)}</td><td>${esc(r.host)}:${r.port}</td>
  <td class="num">${r.status==='alive'?r.latency_ms+' мс':''}</td><td>${esc(r.exit_ip||'')}</td>
  <td class="num">${r.speed_mbps?r.speed_mbps.toFixed(1):''}</td><td class="num">${r.ul_mbps?r.ul_mbps.toFixed(1):''}</td>
  <td>${r.running?`<button data-stop="${esc(r.id)}">Стоп :${r.local_port}</button>`:(r.status==='alive'?`<button data-start="${esc(r.id)}">Старт</button>`:'')}</td></tr>`).join('');
  const lg=$('log'),atEnd=lg.scrollTop+lg.clientHeight>=lg.scrollHeight-8;
  lg.textContent=(s.log||[]).join('\n');if(atEnd)lg.scrollTop=lg.scrollHeight;
}
document.addEventListener('click',async e=>{
  const st=e.target.dataset;
  try{
    if(st.start)await api('POST','/api/line',{id:st.start,port:0});
    if(st.stop)await api('DELETE','/api/line?id='+encodeURIComponent(st.stop));
  }catch(err){if(err.message!=='auth')alert(err.message)}
  if(st.start||st.stop)poll();
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('sel'))api('POST','/api/select',{id:e.target.dataset.id,on:e.target.checked}).catch(()=>{});
});

let timer=null;
async function poll(){
  clearTimeout(timer);
  try{render(await api('GET','/api/state'))}catch(e){}
  timer=setTimeout(poll,busy?1000:3000);
}
checkAuth().then(ok=>{if(ok)poll()});
</script>
</body>
</html>
